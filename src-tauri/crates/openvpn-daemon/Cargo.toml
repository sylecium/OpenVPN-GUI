[package]
name = "openvpn-daemon"
version = "0.2.1"
description = "System-facing daemon: Unix control socket (peer UID check), spawn OpenVPN from .ovpn path, stream logs, connect/disconnect/status."
license = "MIT"
edition = "2021"

[dependencies]
openvpn-ipc = { path = "../openvpn-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
