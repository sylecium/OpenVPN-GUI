<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenVPN GUI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-base: #0a0a0a;
            --surface-bg: #121212;
            --surface-border: #262626;
            --surface-hover: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --text-muted: #52525b;
            
            --accent: #ffffff;
            --accent-fg: #000000;
            --accent-hover: #e5e5e5;
            
            --status-offline: #737373;
            --status-connecting: #eab308;
            --status-online: #22c55e;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        }

        :root[data-theme="light"] {
            --bg-base: #f4f4f5;
            --surface-bg: #ffffff;
            --surface-border: #e4e4e7;
            --surface-hover: #f4f4f5;
            --text-primary: #09090b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            
            --accent: #09090b;
            --accent-fg: #ffffff;
            --accent-hover: #27272a;
            
            --status-offline: #a1a1aa;
            --status-connecting: #eab308;
            --status-online: #22c55e;
            
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            width: 1000px;
            height: 650px;
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-xl);
            display: flex;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            background: var(--surface-bg);
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--surface-border);
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-primary);
            fill: none;
            stroke-width: 2;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
        }

        .import-section {
            padding: 20px;
        }

        .import-btn {
            width: 100%;
            padding: 12px;
            background: var(--surface-bg);
            border: 1px dashed var(--surface-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .import-btn:hover {
            border-color: var(--text-secondary);
            background: var(--surface-hover);
        }

        .vpn-list {
            list-style: none;
            padding: 0 16px 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .vpn-item {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
        }

        .vpn-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vpn-item:hover {
            background: var(--surface-hover);
        }

        .vpn-item.active {
            background: var(--accent);
            color: var(--accent-fg);
        }

        .vpn-item.active .vpn-name {
            color: var(--accent-fg);
        }
        
        .vpn-item.active .vpn-status-text,
        .vpn-item.active svg {
            color: var(--accent-fg);
            opacity: 0.8;
        }

        .vpn-icon {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
        }

        .vpn-item.active .vpn-icon {
            color: var(--accent-fg);
        }

        .vpn-info {
            display: flex;
            flex-direction: column;
        }

        .vpn-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .vpn-status-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            padding: 4px;
        }

        .vpn-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: #ef4444;
        }
        .vpn-item.active .delete-btn:hover {
            color: var(--accent-fg);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
        }

        .content-header {
            padding: 40px 40px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .profile-title-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--status-offline);
            position: relative;
        }

        .status-ping {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--status-online);
            opacity: 0;
        }

        .is-online .status-indicator {
            background-color: var(--status-online);
        }
        .is-online .status-ping {
            animation: ping 2s infinite;
        }

        .is-connecting .status-indicator {
            background-color: var(--status-connecting);
            animation: pulse 1.5s infinite;
        }

        @keyframes ping {
            75%, 100% { transform: scale(2.5); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content-header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .file-path {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .connect-btn {
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
        }

        .connect-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .connect-btn.connected {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--surface-border);
        }

        .connect-btn.connected:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* Stats Section */
        .stats-grid {
            padding: 0 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface-bg);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Terminal Window */
        .terminal-container {
            padding: 0 40px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .terminal-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .terminal-header {
            background: #111111;
            border-bottom: 1px solid #333333;
            padding: 10px 16px;
            display: flex;
            align-items: center;
        }

        .terminal-title {
            font-size: 12px;
            color: #888888;
            font-family: 'JetBrains Mono', monospace;
        }

        .terminal-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-line {
            display: flex;
            gap: 12px;
        }

        .log-time { color: #666666; }
        .log-msg { color: #cccccc; }
        .log-msg.highlight { color: #ffffff; font-weight: 600; }
        .log-msg.success { color: #4ade80; }
        .log-msg.warning { color: #facc15; }
        .log-msg.error { color: #f87171; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .hidden { display: none !important; }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-secondary);
            gap: 16px;
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke-width: 1;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    OpenVPN GUI
                </div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle Light/Dark Mode">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
            
            <div class="import-section">
                <input type="file" id="import-input" accept=".ovpn" class="hidden">
                <button class="import-btn" id="import-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Import .ovpn File
                </button>
            </div>

            <ul class="vpn-list" id="vpn-list">
                <!-- Populated by JS -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="content-view" class="hidden" style="display: flex; flex-direction: column; flex: 1;">
                <div class="content-header">
                    <div class="profile-title-wrapper">
                        <div class="profile-title">
                            <div class="status-indicator" id="status-indicator">
                                <div class="status-ping"></div>
                            </div>
                            <h1 id="current-vpn-name">Profile Name</h1>
                        </div>
                        <div class="file-path">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                            <span id="current-vpn-path">/path/to/config.ovpn</span>
                        </div>
                    </div>

                    <button class="connect-btn" id="connect-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
                        <span id="connect-btn-text">Connect</span>
                    </button>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Protocol</span>
                        <span class="stat-value" id="stat-protocol">UDP</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Cipher</span>
                        <span class="stat-value" id="stat-cipher">AES-256-GCM</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Remote</span>
                        <span class="stat-value" id="stat-remote">10.0.0.1:1194</span>
                    </div>
                </div>

                <div class="terminal-container">
                    <div class="terminal-wrapper">
                        <div class="terminal-header">
                            <span class="terminal-title">openvpn-daemon</span>
                        </div>
                        <div class="terminal-body" id="terminal-body">
                            <!-- Logs populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <div>
                    <h3>No Profile Selected</h3>
                    <p style="font-size: 14px; margin-top: 8px;">Select a profile from the sidebar or import a new .ovpn file.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- Theme Management ---
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlDoc = document.documentElement;

        const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';

        function toggleTheme() {
            const currentTheme = htmlDoc.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            htmlDoc.setAttribute('data-theme', newTheme);
            themeIcon.innerHTML = newTheme === 'dark' ? sunIcon : moonIcon;
        }
        themeToggle.addEventListener('click', toggleTheme);
        // Initialize theme icon correctly (starts as dark)
        themeIcon.innerHTML = sunIcon;


        // --- Data Management ---
        let vpnConfigs = [
            { id: '1', name: 'Work Network', path: '/home/user/vpn/work.ovpn', protocol: 'UDP / IPv4', cipher: 'AES-256-GCM', remote: 'vpn.company.com:1194' },
            { id: '2', name: 'Home Lab', path: '/home/user/vpn/homelab.ovpn', protocol: 'TCP / IPv4', cipher: 'CHACHA20-POLY1305', remote: '192.168.1.100:443' }
        ];

        let activeConfigId = null;
        let isConnected = false;
        let isConnecting = false;
        let connectionTimeout = null;

        // --- DOM Elements ---
        const vpnListEl = document.getElementById('vpn-list');
        const emptyStateEl = document.getElementById('empty-state');
        const contentViewEl = document.getElementById('content-view');
        
        const currentNameEl = document.getElementById('current-vpn-name');
        const currentPathEl = document.getElementById('current-vpn-path');
        const statProtocolEl = document.getElementById('stat-protocol');
        const statCipherEl = document.getElementById('stat-cipher');
        const statRemoteEl = document.getElementById('stat-remote');
        
        const connectBtn = document.getElementById('connect-btn');
        const connectBtnText = document.getElementById('connect-btn-text');
        const statusIndicatorEl = document.getElementById('status-indicator');
        const terminalBodyEl = document.getElementById('terminal-body');

        const importBtn = document.getElementById('import-btn');
        const importInput = document.getElementById('import-input');

        // --- Functions ---
        function renderList() {
            vpnListEl.innerHTML = '';
            vpnConfigs.forEach(config => {
                const li = document.createElement('li');
                li.className = `vpn-item ${config.id === activeConfigId ? 'active' : ''}`;
                li.onclick = (e) => {
                    if(!e.target.closest('.delete-btn')) {
                        selectConfig(config.id);
                    }
                };
                
                li.innerHTML = `
                    <div class="vpn-item-left">
                        <svg class="vpn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                        </svg>
                        <div class="vpn-info">
                            <span class="vpn-name">${config.name}</span>
                            <span class="vpn-status-text">${config.id === activeConfigId && isConnected ? 'Connected' : 'Offline'}</span>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteConfig('${config.id}')" title="Remove Profile">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                `;
                vpnListEl.appendChild(li);
            });

            if(vpnConfigs.length === 0) {
                activeConfigId = null;
                updateUI();
            }
        }

        function deleteConfig(id) {
            if (isConnecting || (isConnected && activeConfigId === id)) return;
            vpnConfigs = vpnConfigs.filter(c => c.id !== id);
            if (activeConfigId === id) {
                activeConfigId = null;
                clearLogs();
            }
            renderList();
            updateUI();
        }

        function selectConfig(id) {
            if (isConnecting || isConnected) return; // Prevent switching while active
            activeConfigId = id;
            clearLogs();
            updateUI();
        }

        function updateUI() {
            if (!activeConfigId) {
                emptyStateEl.classList.remove('hidden');
                contentViewEl.classList.add('hidden');
            } else {
                emptyStateEl.classList.add('hidden');
                contentViewEl.classList.remove('hidden');

                const config = vpnConfigs.find(c => c.id === activeConfigId);
                if(config) {
                    currentNameEl.textContent = config.name;
                    currentPathEl.textContent = config.path;
                    statProtocolEl.textContent = config.protocol;
                    statCipherEl.textContent = config.cipher;
                    statRemoteEl.textContent = config.remote;
                }
            }
            renderList();
        }

        // --- Import Logic ---
        importBtn.addEventListener('click', () => importInput.click());
        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const newId = Date.now().toString();
                vpnConfigs.push({
                    id: newId,
                    name: file.name.replace('.ovpn', ''),
                    path: file.path || `~/Downloads/${file.name}`,
                    protocol: 'UDP / IPv4', // Simulated parsing
                    cipher: 'AES-256-GCM',
                    remote: 'unknown:1194'
                });
                selectConfig(newId);
                importInput.value = ''; // Reset
            }
        });

        // --- Connection Simulation ---
        function addLog(msg, type = 'normal') {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            
            const div = document.createElement('div');
            div.className = 'log-line';
            
            let msgClass = 'log-msg';
            if (type === 'highlight') msgClass += ' highlight';
            if (type === 'success') msgClass += ' success';
            if (type === 'warning') msgClass += ' warning';
            if (type === 'error') msgClass += ' error';

            div.innerHTML = `<span class="log-time">[${time}]</span><span class="${msgClass}">${msg}</span>`;
            terminalBodyEl.appendChild(div);
            terminalBodyEl.scrollTop = terminalBodyEl.scrollHeight;
        }

        function clearLogs() {
            terminalBodyEl.innerHTML = '';
        }

        connectBtn.addEventListener('click', () => {
            if (isConnecting) return;
            const config = vpnConfigs.find(c => c.id === activeConfigId);

            if (isConnected) {
                // Disconnect
                isConnected = false;
                connectBtn.classList.remove('connected');
                connectBtnText.textContent = 'Connect';
                connectBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg><span id="connect-btn-text">Connect</span>`;
                statusIndicatorEl.parentElement.classList.remove('is-online');
                
                addLog('SIGTERM received, disconnecting...', 'warning');
                addLog('TUN/TAP interface closed');
                addLog('Initialization Sequence Completed With Errors (SIGTERM)', 'error');
                
                renderList();
            } else {
                // Connect
                isConnecting = true;
                clearLogs();
                
                connectBtnText.textContent = 'Connecting...';
                statusIndicatorEl.parentElement.classList.add('is-connecting');
                
                addLog(`OpenVPN GUI starting connection for profile: ${config.name}`, 'highlight');
                addLog(`Reading configuration from ${config.path}`);
                
                setTimeout(() => addLog(`Attempting to establish TCP connection with [AF_INET]${config.remote}`), 800);
                
                setTimeout(() => {
                    addLog(`[SERVER] Peer Connection Initiated`, 'success');
                    addLog(`Data Channel: using negotiated cipher '${config.cipher}'`, 'highlight');
                }, 1500);

                setTimeout(() => addLog(`TUN/TAP device tun0 opened`), 2200);

                connectionTimeout = setTimeout(() => {
                    isConnecting = false;
                    isConnected = true;
                    
                    connectBtn.classList.add('connected');
                    connectBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg><span id="connect-btn-text">Disconnect</span>`;
                    
                    statusIndicatorEl.parentElement.classList.remove('is-connecting');
                    statusIndicatorEl.parentElement.classList.add('is-online');
                    
                    addLog(`Initialization Sequence Completed`, 'success');
                    renderList();
                }, 3000);
            }
        });

        // Init
        if (vpnConfigs.length > 0) {
            selectConfig(vpnConfigs[0].id);
        } else {
            renderList();
            updateUI();
        }
    </script>
</body>
</html>
