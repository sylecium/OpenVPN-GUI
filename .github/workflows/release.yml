name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create and upload GitHub Release assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── System dependencies ────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openvpn \
            alien \
            dpkg-dev \
            rpm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Toolchains ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Frontend & Tauri build ─────────────────────────────────────────────
      # --ignore-scripts skips the `husky prepare` hook (not needed on CI)
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build .deb package
        run: npm run build:deb
        # build-deb.sh calls `npm run tauri build -- --bundles deb`
        # which triggers beforeBuildCommand (compiles openvpn-daemon too),
        # then injects postinst / prerm / postrm scripts into the .deb.

      # ── Locate artefacts ───────────────────────────────────────────────────
      - name: Locate .deb file
        id: deb
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" -type f | head -1)
          if [[ -z "$DEB" ]]; then
            echo "::error::No .deb file found after build"
            exit 1
          fi
          echo "path=$DEB"        >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DEB")" >> "$GITHUB_OUTPUT"

      # ── RPM build ──────────────────────────────────────────────────────────
      - name: Build native RPM package
        id: rpm
        run: |
          npm run build:rpm
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" -type f | head -1)
          if [[ -z "$RPM" ]]; then
            echo "::error::No .rpm file found after build"
            exit 1
          fi
          echo "path=$RPM"        >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$RPM")" >> "$GITHUB_OUTPUT"

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generate release notes from Conventional Commits since last tag
          generate_release_notes: true
          files: |
            ${{ steps.deb.outputs.path }}
            ${{ steps.rpm.outputs.path }}
